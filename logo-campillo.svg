  </defs>
  <!-- Bouclier hexagonal -->
  <path d="M32 4 L56 18 V46 L32 60 L8 46 V18 Z" style="fill: color-mix(in srgb, #a855f7 12%, #0c0b12)" stroke="url(#yc-grad-fixe)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M32 10.5 L50.5 21.2 V42.8 L32 53.5 L13.5 42.8 V21.2 Z" fill="none" style="stroke: #a855f7" stroke-opacity="0.28" stroke-width="1"/>
  <!-- C : piste de circuit -->
