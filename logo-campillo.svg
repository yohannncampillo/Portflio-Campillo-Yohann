<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo Yohann Campillo">
  <defs>
    <linearGradient id="yc-grad-fixe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: #ff9a8b"/>
      <stop offset="1" style="stop-color: #a855f7"/>
